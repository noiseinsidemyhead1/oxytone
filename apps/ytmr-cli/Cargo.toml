[package]
name = "ytmr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal", "time", "sync"] }
tracing = "0.1.44"
ytmr-catalog = { version = "0.1.0", path = "../../crates/ytmr-catalog" }
ytmr-core = { version = "0.1.0", path = "../../crates/ytmr-core" }
ytmr-os = { version = "0.1.0", path = "../../crates/ytmr-os" }
ytmr-player = { version = "0.1.0", path = "../../crates/ytmr-player" }

[package]
name = "oxytone-os"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
discord-rich-presence = "1.1.0"
notify-rust = "4.17.0"
# zbus plutôt que libdbus : rien à installer côté système sous Linux.
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync"] }
tracing = "0.1.44"
oxytone-core = { version = "0.1.0", path = "../oxytone-core" }
oxytone-media = { version = "0.1.0", path = "../oxytone-media" }

[target."cfg(windows)".dependencies]
# Bulle compacte (pochette en petit à gauche) : notify-rust ne sait pas la poser ainsi.
tauri-winrt-notification = "0.7.3"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Registry", "Win32_Security_Cryptography"] }
winreg = "0.56.0"

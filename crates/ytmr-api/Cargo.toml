[package]
name = "ytmr-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
mime_guess = "2.0.5"
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt", "macros", "time", "sync"] }
tracing = "0.1.44"
ytmr-catalog = { version = "0.1.0", path = "../ytmr-catalog" }
ytmr-core = { version = "0.1.0", path = "../ytmr-core" }
ytmr-media = { version = "0.1.0", path = "../ytmr-media" }
ytmr-player = { version = "0.1.0", path = "../ytmr-player" }

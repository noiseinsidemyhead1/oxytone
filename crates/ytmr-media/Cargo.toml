[package]
name = "ytmr-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = "0.13"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "sync", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[package]
name = "ytmr-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "sync", "time"] }
tracing = "0.1.44"
ytmapi-rs = { version = "0.3.3", features = ["reqwest"] }
ytmr-core = { version = "0.1.0", path = "../ytmr-core" }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

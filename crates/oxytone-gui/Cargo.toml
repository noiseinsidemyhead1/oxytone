[package]
name = "oxytone-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
fastrand = "2.5.0"
iced = { version = "0.14", features = ["image", "tokio", "advanced", "svg"] }
raw-window-handle = "0.6"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "sync", "time", "macros"] }
tracing = "0.1.44"
oxytone-api = { version = "0.1.0", path = "../oxytone-api" }
oxytone-catalog = { version = "0.1.0", path = "../oxytone-catalog" }
oxytone-core = { version = "0.1.0", path = "../oxytone-core" }
oxytone-media = { version = "0.1.0", path = "../oxytone-media" }
oxytone-os = { version = "0.1.0", path = "../oxytone-os" }
oxytone-player = { version = "0.1.0", path = "../oxytone-player" }
